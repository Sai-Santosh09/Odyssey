[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odyssey-backend"
version = "1.0.0"
description = "Odyssey Travel Planner Backend API"
authors = [{ name = "Odyssey Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "supabase>=2.4.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.1",
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pyright]
include = ["app"]
extraPaths = ["."]
